# Default training config (Hydra). Override on the command line, e.g.:
#   python train.py algo=sm_grpo env.env_id=Hopper-v5 sm_grpo.k=8
defaults:
  - _self_

seed: 0
device: mps  # "mps" | "cpu" | "cuda" -- falls back to cpu automatically if unavailable

env:
  env_id: Hopper-v5
  backend: gymnasium  # "gymnasium" | "metaworld" | "libero"
  max_episode_steps: 200

algo: grpo  # "ppo" | "grpo" | "rloo" | "tgrpo" | "sm_grpo" | "sm_grpo_memory"

training:
  num_iterations: 200
  num_groups_per_iteration: 4
  group_size: 8          # G, roadmap Section 9: "G = 8 to 16 rollouts"
  max_steps_per_episode: 200
  gamma: 0.99
  lr: 3.0e-4
  grad_clip: 1.0
  # Z-score the final advantage batch to zero-mean/unit-variance (algos/common.py's
  # normalize_batch_advantages), applied identically across grpo/rloo/tgrpo/sm_grpo.
  # Added 2026-10-26 after finding GRPO's and SM-GRPO's "normalized" advantages weren't
  # actually on the same scale as each other (docs/progress.md) -- turn this on for any
  # head-to-head comparison between critic-free algos so a shared LR means a shared
  # effective step size. Off by default to keep existing per-algo runs reproducible.
  match_advantage_scale: false
  # Actual KL(policy || reference) penalty added to the loss, not just logged. Added
  # 2026-10-27c: kl_to_reference had been computed and logged by every algos/*.py since
  # Month 2 but never once used in a loss -- the roadmap's "keep a KL penalty... to
  # prevent collapse" safeguard was pure telemetry. TensorBoard showed KL drifting from
  # ~0.1 to 6-900+ over a single run even for MM-GRPO, whose gradients are otherwise
  # stable -- unconstrained policy drift away from the good BC init is a plausible
  # second contributor to the plateau/collapse, independent of the group-std mechanism
  # in docs/progress.md. Only grpo.py and sm_grpo_memory.py read this so far (the two
  # methods under active comparison); 0.0 keeps every existing result reproducible.
  kl_coef: 0.0
  eval_every: 10
  checkpoint_every: 50
  log_dir: outputs

policy:
  hidden_sizes: [256, 256]
  log_std_init: -0.5
  # Warm-start the *trainable* policy from a BC checkpoint (roadmap Section 7, Month 2:
  # "Implement baselines on top of the behaviour-cloning policy"). Leave null to train
  # from random init (e.g. the Hopper-v5 smoke tests, which have no BC policy).
  init_checkpoint: null

reference_policy:
  # Path to a frozen behaviour-cloning checkpoint for the KL-to-reference diagnostic
  # (roadmap Section 9: "Keep a KL penalty or clipping to the reference (BC) policy").
  # Leave null to skip loading one (e.g. the very first sanity-check runs). Usually the
  # same file as policy.init_checkpoint.
  checkpoint: null

# --- per-algo knobs, read by the matching algos/*.py update() ---
grpo:
  robust_normalize: false  # Idea B toggle
  sigma_min: 0.01
  normalize_mode: group_std  # "group_std" | "mean_only" (REINFORCE++-style global norm)

rloo: {}

tgrpo:
  alpha: 0.5

sm_grpo:
  k: 4
  time_window: 5
  # Default true (unlike grpo.robust_normalize, which is an ablation toggle for an
  # already-normalized advantage): state_matched_baselines returns a RAW, unnormalized
  # return-to-go difference, with no scale control at all when this is off. A first
  # Month-3 run at robust_normalize=false measured advantage_abs_mean=12.6 at iter 0 vs.
  # GRPO's properly-scaled ~0.74 at the same LR -- a ~17x larger effective step size --
  # and collapsed faster than vanilla GRPO as a direct result. See docs/progress.md.
  robust_normalize: true
  sigma_min: 0.01

ppo:
  lam: 0.95
  clip_ratio: 0.2
  epochs: 4
  minibatch_size: 256
  value_coef: 0.5
  entropy_coef: 0.0
  value_lr: 1.0e-3

sm_grpo_memory:
  # MM-GRPO (novel extension, proposed 2026-10-26, see advantages/replay_buffer.py):
  # like sm_grpo but the k-NN baseline also draws candidates from a persistent,
  # cross-iteration buffer, not just the current group.
  k: 4
  time_window: 5
  robust_normalize: true
  sigma_min: 0.01
  buffer_capacity: 50000
  memory_max_age: null  # iterations; null = no recency limit on buffer candidates
